name: Mindwtr MiMo APK

on:
  push:
    branches:
      - codex/mimo-voice-calendar-weeks
    paths:
      - '.github/workflows/mimo-android-apk.yml'
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'patches/**'
      - 'bun.lock'
      - 'package.json'
      - '.bun-version'
      - 'scripts/ci/setup-android-sdk.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimo-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  APP_VARIANT: mimo
  ARCHS: arm64-v8a
  NODE_OPTIONS: --max-old-space-size=6144
  EXPO_NO_TELEMETRY: '1'

jobs:
  apk:
    name: Build installable arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: bash scripts/ci/setup-android-sdk.sh
        env:
          ANDROID_SDK_PACKAGES: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mimo-android-${{ hashFiles('bun.lock', 'patches/**', 'apps/mobile/plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-mimo-android-

      - name: Install dependencies and native recorder patch
        run: bun install --frozen-lockfile

      - name: Verify Android app variant
        working-directory: apps/mobile
        run: bun run test -- tests/app-config-variant.test.ts

      - name: Build standalone release APK
        run: bash apps/mobile/scripts/android_build.sh

      - name: Verify and collect APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find apps/mobile/build -maxdepth 1 -name 'mindwtr-*-arm64-v8a.apk' -type f)
          test "${#apks[@]}" -eq 1
          mkdir -p apk
          version=$(node -p "require('./apps/mobile/package.json').version")
          apk="apk/mindwtr-mimo-${version}-arm64-v8a.apk"
          cp "${apks[0]}" "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" > apk/package-info.txt
          grep -F "name='tech.dongdongbh.mindwtr.mimo'" apk/package-info.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.getinfo('assets/index.android.bundle').file_size > 0, 'Missing bundled JavaScript'
              assert apk.testzip() is None, 'Corrupted APK'
          PY
          bash scripts/ci/check-android-16kb-page-size.sh "$apk"
          (cd apk && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo 'Mindwtr MiMo — Android arm64 独立安装包'
            echo "Source commit: ${GITHUB_SHA}"
            echo '包名：tech.dongdongbh.mindwtr.mimo，可与原版并存。'
            echo '安装后：设置 → AI → 语音 → 小米 MiMo · 语音识别，填写自己的 API Key。'
            echo '使用项目测试签名；用于自行安装，后续更新需保持同一签名。'
          } > apk/README.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mindwtr-mimo-android-arm64
          path: apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Write download instructions
        run: |
          {
            echo '### Mindwtr MiMo APK 已生成'
            echo '在本次运行的 Artifacts 中下载 `mindwtr-mimo-android-arm64`，解压后安装 APK。'
            echo '包含小米 MiMo 语音识别与 ISO 日历周数。适用于 arm64 Android 手机。'
          } >> "$GITHUB_STEP_SUMMARY"
